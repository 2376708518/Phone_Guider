name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [eurochat-apk-build]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: EuroChatTranslate_WABusiness_V02
      - uses: actions/upload-artifact@v4
        with:
          name: EuroChatTranslate-WABusiness-debug-apk
          path: EuroChatTranslate_WABusiness_V02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
